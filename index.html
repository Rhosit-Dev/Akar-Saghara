<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kartu Kenangan Mangrove</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep: #0e3b34;
      --teal: #2f7d73;
      --lime: #9ccc65;
      --mist: #eef3ee;
      --ink: #16302b;
      --mud: #6b5a4a;
      --line: #cddbd2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --mist: #0d1f1c;
        --ink: #e6f0ea;
        --mud: #a8b8ae;
        --line: #27453f;
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--mist);
      color: var(--ink);
      font: 16px/1.5 "Poppins", sans-serif
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 18px 48px
    }

    header {
      padding: 8px 0 20px
    }

    .tree {
      display: inline-block;
      background: var(--deep);
      color: #e9f7ef;
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 14px;
      margin-bottom: 10px
    }

    h1 {
      font: 700 28px/1.15 "Poppins", sans-serif;
      margin: 0 0 6px
    }

    p.lead {
      margin: 0;
      color: var(--mud)
    }

    label {
      display: block;
      font-weight: 600;
      margin: 18px 0 6px
    }

    input[type=text],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: transparent;
      color: inherit;
      font: inherit
    }

    textarea {
      min-height: 110px;
      resize: vertical
    }

    input:focus,
    textarea:focus,
    button:focus-visible {
      outline: 3px solid var(--lime);
      outline-offset: 1px
    }

    .count {
      font-size: 13px;
      color: var(--mud);
      text-align: right
    }

    .photo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 2px dashed var(--teal);
      border-radius: 14px;
      padding: 22px 14px;
      cursor: pointer;
      text-align: center;
      color: var(--teal);
      font-weight: 600
    }

    .photo.has {
      border-style: solid
    }

    .photo input {
      display: none
    }

    .editor-preview {
      margin-top: 16px;
      border-radius: 14px;
      overflow: hidden;
      background: #d7e2d9
    }

    #kanvas {
      display: block;
      width: 100%;
      height: auto
    }

    .zoom-control {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px
    }

    .zoom-control label {
      margin: 0;
      white-space: nowrap
    }

    .zoom-control input {
      flex: 1;
      min-width: 0;
      accent-color: var(--teal)
    }

    .zoom-value {
      min-width: 48px;
      color: var(--mud);
      font-size: 13px;
      text-align: right
    }

    button {
      font: inherit;
      font-weight: 700;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      width: 100%;
      cursor: pointer
    }

    .primary {
      background: var(--deep);
      color: #fff;
      margin-top: 22px
    }

    .ghost {
      background: transparent;
      border: 2px solid var(--deep);
      color: var(--ink);
      margin-top: 10px
    }

    button:disabled {
      opacity: .55;
      cursor: default
    }

    .consent {
      font-size: 13px;
      color: var(--mud);
      margin-top: 10px
    }

    .err {
      color: #b3261e;
      font-weight: 600;
      margin-top: 12px
    }

    #hasil {
      display: none
    }

    #hasil img {
      width: 100%;
      border-radius: 14px;
      display: block;
      box-shadow: 0 6px 24px rgba(14, 59, 52, .25)
    }

    .ok {
      background: var(--deep);
      color: #e9f7ef;
      border-radius: 12px;
      padding: 12px 14px;
      margin: 14px 0
    }

    .hint {
      font-size: 13px;
      color: var(--mud);
      margin-top: 8px;
      text-align: center
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <span class="tree" id="badge"></span>
      <h1>Kartu kenangan penanamanmu</h1>
      <p class="lead">Unggah foto, atur tampilannya, lalu simpan kartu kenanganmu.</p>
    </header>

    <form id="form" novalidate>
      <label for="foto">Foto saat menanam</label>
      <label class="photo" id="photoBox" style="font-weight:600;margin:0">
        <input id="foto" type="file" accept="image/*">
        <span id="photoText">Pilih atau ambil foto</span>
      </label>
      <div class="editor-preview">
        <canvas id="kanvas" width="1080" height="1350" aria-label="Pratinjau kartu"></canvas>
      </div>
      <div class="zoom-control">
        <label for="zoom">Zoom foto</label>
        <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1" disabled>
        <span class="zoom-value" id="zoomValue">1.00×</span>
      </div>

      <label for="nama">Nama kamu</label>
      <input id="nama" type="text" maxlength="40" autocomplete="name" placeholder="Nama lengkap atau panggilan">

      <label for="namaMangrove">Nama mangrovemu</label>
      <input id="namaMangrove" type="text" maxlength="40" autocomplete="name" placeholder="Tulis nama mangrove yang kamu tanam">

      <label for="pesan">Kesan dan pesan</label>
      <textarea id="pesan" maxlength="160" placeholder="Tulis kesanmu setelah menanam mangrove"></textarea>
      <div class="count"><span id="n">0</span>/160</div>

      <div id="err" class="err" role="alert"></div>
      <button class="primary" id="btnBuat" type="submit">Buat kartu</button>
      <p class="consent">Dengan melanjutkan, kamu setuju kartu ini disimpan dan ditampilkan oleh panitia.</p>
    </form>

    <section id="hasil">
      <img id="preview" alt="Pratinjau kartu kenangan">
      <div class="ok" id="status"></div>
      <button class="ghost" id="btnUbah" type="button">Edit</button>
      <button class="primary" id="btnUnduh" type="button">Download kartu</button>
      <button class="ghost" id="btnRetry" type="button" style="display:none">Coba simpan lagi</button>
      <p class="hint" id="hint" style="display:none">Jika tombol unduh tidak berfungsi, tekan lama gambar lalu pilih
        simpan.</p>
    </section>
  </div>

  <img id="template" src="assets/template-mangrove.png" alt="" hidden>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    const $ = id => document.getElementById(id);
    const templateLoaded = $("template").decode();

    // Nomor pohon dari QR: ?pohon=017
    const pohon = (new URLSearchParams(location.search).get("pohon") || "").replace(/[^\w-]/g, "").slice(0, 20);
    $("badge").textContent = pohon ? "Pohon No. " + pohon : "Pohon mangrove";

    let bitmapFoto = null, blobKartu = null, previewUrl = null;
    let pendingRecord = null, pendingStoragePath = null, uploadedCardUrl = null;

    function wrap(x, text, maxW) {
      const lines = []; let line = "";
      for (const w of text.split(/\s+/)) {
        const t = line ? line + " " + w : w;
        if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
      }
      if (line) lines.push(line);
      return lines;
    }

    async function gambarKartu(nama, namaMangrove, pesan) {
      await Promise.all([document.fonts.ready, templateLoaded]);
      const W = 1080, H = 1350;
      const c = $("kanvas"); c.width = W; c.height = H;
      const x = c.getContext("2d");
      const zoom = Number($("zoom").value);
      const scale = Math.max(W / bitmapFoto.width, H / bitmapFoto.height) * zoom;
      const photoWidth = bitmapFoto.width * scale, photoHeight = bitmapFoto.height * scale;
      x.drawImage(bitmapFoto, (W - photoWidth) / 2, (H - photoHeight) / 2, photoWidth, photoHeight);
      x.drawImage($("template"), 0, 0, W, H);

      x.textAlign = "left"; x.textBaseline = "alphabetic";
      x.fillStyle = "#365004"; x.font = "600 32px Poppins, sans-serif";
      x.fillText(nama.trim(), 213, 937, 790);
      x.fillText(namaMangrove.trim(), 390, 981, 620);
      x.font = "500 27px Poppins, sans-serif";
      let lines = wrap(x, pesan.trim(), 900);
      if (lines.length > 4) { lines = lines.slice(0, 4); lines[3] = lines[3].replace(/.{0,3}$/, "\u2026"); }
      lines.forEach((line, i) => x.fillText(line, 92, 1050 + i * 38, 900));
    }

    async function eksporKartu(nama, namaMangrove, pesan) {
      await gambarKartu(nama, namaMangrove, pesan);
      const c = $("kanvas");
      return new Promise((resolve, reject) => {
        c.toBlob(blob => blob ? resolve(blob) : reject(new Error("Kartu gagal dibuat.")), "image/jpeg", 0.9);
      });
    }

    async function perbaruiPratinjau() {
      if (!bitmapFoto) return;
      try {
        await gambarKartu($("nama").value, $("namaMangrove").value, $("pesan").value);
      } catch (err) {
        console.error(err);
        $("err").textContent = "Gagal memuat template kartu. Periksa file template-mangrove.png.";
      }
    }

    $("foto").addEventListener("change", async e => {
      bitmapFoto?.close();
      bitmapFoto = null;
      const fileFoto = e.target.files[0] || null;
      $("photoBox").classList.toggle("has", !!fileFoto);
      $("photoText").textContent = fileFoto ? "Foto dipilih: " + fileFoto.name : "Pilih atau ambil foto";
      $("zoom").disabled = !fileFoto;
      if (!fileFoto) return;
      try {
        bitmapFoto = await createImageBitmap(fileFoto, { imageOrientation: "from-image" });
        $("err").textContent = "";
        await perbaruiPratinjau();
      } catch (err) {
        console.error(err);
        $("zoom").disabled = true;
        $("err").textContent = "Foto tidak bisa dibaca. Coba pilih foto lain.";
      }
    });

    $("zoom").addEventListener("input", () => {
      $("zoomValue").textContent = Number($("zoom").value).toFixed(2) + "×";
      perbaruiPratinjau();
    });
    ["nama", "namaMangrove", "pesan"].forEach(id => $(id).addEventListener("input", perbaruiPratinjau));
    $("pesan").addEventListener("input", e => { $("n").textContent = e.target.value.length; });

    async function simpanKartu() {
      $("btnRetry").disabled = true;
      $("btnRetry").textContent = "Menyimpan...";
      try {
        if (!uploadedCardUrl) {
          const up = await sb.storage.from(CONFIG.BUCKET).upload(pendingStoragePath, blobKartu, { contentType: "image/jpeg" });
          if (up.error) throw up.error;
          uploadedCardUrl = sb.storage.from(CONFIG.BUCKET).getPublicUrl(pendingStoragePath).data.publicUrl;
        }
        const ins = await sb.from("kenangan").insert({
          pohon: pohon || "-",
          nama: pendingRecord.nama,
          pesan: pendingRecord.pesan,
          kartu_url: uploadedCardUrl
        });
        if (ins.error) throw ins.error;
        $("status").textContent = "Kartu berhasil disimpan. Terima kasih sudah menanam!";
        $("btnRetry").style.display = "none";
      } catch (err) {
        console.error(err);
        $("status").textContent = "Kartu sudah dibuat, tetapi gagal disimpan: " + err.message;
        $("btnRetry").style.display = "";
        $("btnRetry").disabled = false;
        $("btnRetry").textContent = "Coba simpan lagi";
      } finally {
        $("btnUbah").disabled = false;
        $("btnUnduh").disabled = false;
      }
    }

    // ---------- Alur ----------
    $("form").addEventListener("submit", async e => {
      e.preventDefault();
      $("err").textContent = "";
      const nama = $("nama").value.trim(), namaMangrove = $("namaMangrove").value.trim(), pesan = $("pesan").value.trim();
      if (!bitmapFoto) return $("err").textContent = "Pilih foto terlebih dahulu.";
      if (!nama) return $("err").textContent = "Isi namamu.";
      if (!namaMangrove) return $("err").textContent = "Isi nama mangrovenya.";
      if (!pesan) return $("err").textContent = "Tulis kesan dan pesanmu.";
      $("btnBuat").disabled = true; $("btnBuat").textContent = "Membuat dan menyimpan...";
      try {
        blobKartu = await eksporKartu(nama, namaMangrove, pesan);
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(blobKartu);
        $("preview").src = previewUrl;
        $("status").textContent = "Kartu dibuat. Sedang menyimpan...";
        $("btnRetry").style.display = "none";
        $("btnUbah").disabled = true; $("btnUnduh").disabled = true;
        $("hint").style.display = "block";
        $("form").style.display = "none"; $("hasil").style.display = "block";
        pendingRecord = { nama, pesan };
        pendingStoragePath = "pohon-" + (pohon || "x") + "/" + Date.now() + "-" + Math.random().toString(36).slice(2) + ".jpg";
        uploadedCardUrl = null;
        scrollTo(0, 0);
        await simpanKartu();
      } catch (err) {
        console.error(err);
        $("form").style.display = "block"; $("hasil").style.display = "none";
        $("err").textContent = "Kartu gagal dibuat. " + err.message;
      } finally {
        $("btnBuat").disabled = false; $("btnBuat").textContent = "Buat kartu";
      }
    });

    $("btnUbah").addEventListener("click", () => {
      $("hasil").style.display = "none"; $("form").style.display = "block";
    });

    $("btnRetry").addEventListener("click", simpanKartu);

    $("btnUnduh").addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blobKartu);
      a.download = "kartu-mangrove-" + (pohon || "kenangan") + ".jpg";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
  </script>
</body>

</html>
