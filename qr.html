<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator QR Pohon</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#16302b;background:#fff}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px}
  h1{font:700 26px Georgia,serif;margin:0 0 12px}
  .row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:end}
  label{display:flex;flex-direction:column;font-weight:600;font-size:14px;gap:4px}
  input{padding:10px 12px;border:1.5px solid #cddbd2;border-radius:10px;font:inherit}
  #base{width:min(100%,460px)}
  input[type=number]{width:110px}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 16px;background:#0e3b34;color:#fff;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
  .item{border:1.5px dashed #9bb3a6;border-radius:12px;padding:12px;text-align:center;break-inside:avoid}
  .item .q{display:flex;justify-content:center}
  .item b{display:block;margin-top:8px;font:700 18px Georgia,serif}
  .item small{color:#6b5a4a}
  @media print{ .row,h1,.note{display:none} .wrap{padding:0} .grid{margin:0;grid-template-columns:repeat(3,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Generator QR pohon</h1>
  <div class="row">
    <label>Alamat halaman peserta
      <input id="base" type="text">
    </label>
    <label>Dari nomor <input id="a" type="number" min="1" value="1"></label>
    <label>Sampai nomor <input id="b" type="number" min="1" value="50"></label>
    <button id="go">Buat QR</button>
    <button id="print">Cetak</button>
  </div>
  <p class="note" style="color:#6b5a4a;margin:0">Cetak setelah situs final dan alamatnya tidak akan berubah lagi.</p>
  <div class="grid" id="grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
$("base").value = location.origin + location.pathname.replace(/[^/]*$/, "") + "index.html";

function buat(){
  const base = $("base").value.trim(), a = +$("a").value, b = +$("b").value;
  const g = $("grid"); g.innerHTML = "";
  for (let i = a; i <= b && i - a < 500; i++){
    const id = String(i).padStart(3, "0");
    const url = base + (base.includes("?") ? "&" : "?") + "pohon=" + id;
    const d = document.createElement("div"); d.className = "item";
    const q = document.createElement("div"); q.className = "q"; d.appendChild(q);
    new QRCode(q, { text: url, width: 170, height: 170, correctLevel: QRCode.CorrectLevel.M });
    const l = document.createElement("b"); l.textContent = "Pohon " + id;
    const s = document.createElement("small"); s.textContent = "Scan untuk kartu kenangan";
    d.append(l, s); g.appendChild(d);
  }
}
$("go").addEventListener("click", buat);
$("print").addEventListener("click", () => print());
buat();
</script>
</body>
</html>
